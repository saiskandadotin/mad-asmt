version: 2

# Try using these source definitions instead!
sources:
  - name: ecom
    schema: "{{ target.schema }}_raw"
    description: E-commerce data for the Jaffle Shop
    tables:
      - name: raw_customers
        description: One record per person who has purchased one or more items
      - name: raw_orders
        description: One record per order (consisting of one or more order items)
        config:
          loaded_at_field: ordered_at
      - name: raw_items
        description: Items included in an order
      - name: raw_stores
        config:
          loaded_at_field: opened_at
      - name: raw_products
        description: One record per SKU for items sold in stores
      - name: raw_supplies
        description: One record per supply per SKU of items sold in stores
  - name: weather
    schema: "{{ target.schema }}_raw"
    description: weather api metadata
    tables:
      - name: raw_weather_source_api
        description: metadata - api base and path to call (cdc pending)
      - name: raw_weather_source_api_params
        description: metadata - fixed params to be included with evert call, unlikely to change? (cdc pending)
      - name: raw_weather_locations
        description: metadata - Location for which data is to be fetched with its vars (depending on how you "define" location - see boundingbox for example on meteo docs) (cdc pending)
      - name: raw_weather_location_types
        description: metadata - Reference for type of location - to help api calling code decide how to send params (cdc pending)
      - name: raw_weather_params
        description: metadata - open meteo name of the param and flags for current and forecast (cdc pending)